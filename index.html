<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <title>RKShop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <main class="app">
    <section id="home" class="page active">
      <header class="hero">
        <img src="logo.png" class="logo" alt="RKShop" />
        <div class="heroBox">
          <h1>RKSHOP</h1>
          <p>Vos abonnements digitaux au meilleur prix.</p>
        </div>
      </header>

      <section class="trust">
        <div>⚡<span>Livraison<br>rapide</span></div>
        <div>🔒<span>Paiement<br>sécurisé</span></div>
        <div>🎧<span>Support<br>24/7</span></div>
      </section>

      <h2 class="title">Catégories</h2>
      <section id="grid" class="grid"></section>
    </section>

    <section id="product" class="page">
      <button class="back" onclick="goHome()">← Retour</button>
      <div id="productContent"></div>
    </section>

    <section id="orders" class="page">
      <h2 class="title">Commande</h2>
      <div class="panel">
        <h3>Dernière commande</h3>
        <p id="lastOrder">Aucune commande récente.</p>
      </div>
    </section>

    <section id="links" class="page">
      <h2 class="title">Liens</h2>
      <button class="link" onclick="openSnap()">👻 Commander sur Snap</button>
      <button class="link" onclick="openSnap()">💬 Support RKShop</button>
    </section>
  </main>

  <nav class="nav">
    <button class="active" onclick="showPage('home', this)">🏠<span>Accueil</span></button>
    <button onclick="showPage('orders', this)">✅<span>Commande</span></button>
    <button onclick="showPage('links', this)">🔗<span>Liens</span></button>
  </nav>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
