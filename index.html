<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#090806" />
  <title>RKShop Mini App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="background"></div>
  <div class="shade"></div>

  <main class="app">

    <section id="home" class="page active">
      <header class="hero">
        <img src="logo.png" alt="RKShop" class="main-logo" />

        <div class="hero-card">
          <h1>RKSHOP</h1>
          <p>Vos abonnements digitaux, au meilleur prix.</p>
        </div>

        <button class="enter-btn" onclick="scrollToCategories()">
          Entrer dans la boutique
        </button>
      </header>

      <section class="trust-row">
        <div>
          <span>⚡</span>
          <b>Livraison rapide</b>
        </div>
        <div>
          <span>🔒</span>
          <b>Paiement sécurisé</b>
        </div>
        <div>
          <span>🎧</span>
          <b>Support 24/7</b>
        </div>
      </section>

      <section id="categories" class="categories-section">
        <h2>Catégories</h2>
        <div id="categoryGrid" class="category-grid"></div>
      </section>
    </section>

    <section id="product" class="page">
      <button class="back-btn" onclick="showHome()">← Retour</button>
      <div id="productHero" class="product-view"></div>
    </section>

    <section id="orders" class="page">
      <h2>Commandes</h2>
      <div class="info-card">
        <h3>Suivi des commandes</h3>
        <p>Les commandes passées depuis la mini-app seront envoyées à ton bot Telegram.</p>
      </div>
    </section>

    <section id="links" class="page">
      <h2>Liens utiles</h2>

      <button class="link-card" onclick="openSupport()">
        💬 Contacter le support
      </button>

      <button class="link-card" onclick="openSnap()">
        👻 Snapchat RKShop
      </button>

      <button class="link-card" onclick="openTelegram()">
        📲 Telegram RKShop
      </button>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav active" onclick="showPage('home', this)">
      <span>🏠</span>
      Accueil
    </button>

    <button class="nav" onclick="showPage('orders', this)">
      <span>✅</span>
      Commande
    </button>

    <button class="nav" onclick="showPage('links', this)">
      <span>🔗</span>
      Liens
    </button>
  </nav>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
