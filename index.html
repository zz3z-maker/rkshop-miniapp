<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>RKShop Mini App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-overlay"></div>

  <main id="app">
    <section id="home" class="page active">
      <header class="top">
        <img src="assets/logo.png" class="logo" alt="RKShop logo">
        <div class="shop-card">
          <h1>RKSHOP</h1>
          <p>Produits digitaux • Livraison rapide • Support 24/7</p>
        </div>
      </header>

      <div class="section-title">Catégories</div>

      <section class="grid" id="categoryGrid"></section>
    </section>

    <section id="product" class="page">
      <button class="back-btn" onclick="showHome()">← Retour</button>
      <div class="product-hero" id="productHero"></div>
    </section>

    <section id="orders" class="page">
      <h2>Commandes</h2>
      <div class="empty-card">
        <b>Aucune commande affichée</b>
        <p>Quand un client commande, tu peux recevoir la demande sur Telegram.</p>
      </div>
    </section>

    <section id="links" class="page">
      <h2>Liens</h2>
      <div class="link-card" onclick="openSupport()">💬 Contacter le support</div>
      <div class="link-card" onclick="openSnap()">👻 Snapchat RKShop</div>
      <div class="link-card" onclick="openTelegram()">📲 Telegram</div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active" onclick="showPage('home', this)">🏠<span>Accueil</span></button>
    <button class="nav" onclick="showPage('orders', this)">✅<span>Commande</span></button>
    <button class="nav" onclick="showPage('links', this)">🔗<span>Liens</span></button>
  </nav>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
